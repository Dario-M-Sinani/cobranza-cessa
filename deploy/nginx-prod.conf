# Gateway de PRODUCCIÓN (instancia /opt/cobranza-cessa-prod, gunicorn 127.0.0.1:8002).
# La instala deploy/instalar_prod.sh en /etc/nginx/sites-available/cobranza-cessa-prod (sin enlazar).
# Para encender: cambiar DOMINIO_PROD por el dominio que asigne la red (DNS en Cloudflare + NAT
# a la .88:443), enlazar en sites-enabled, `nginx -t` y recargar.
#
# Solo expone /api/externo/ (lo que llama cessa-laravel, protegido por X-Api-Key): el panel de
# cajeras, /admin y el resto de /api/ de producción no se publican en este dominio.

server {
    listen 443 ssl;
    server_name DOMINIO_PROD;

    ssl_certificate     /etc/nginx/ssl/cessa-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cessa-origin.key;

    client_max_body_size 5m;

    location /api/externo/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location / {
        return 404;
    }
}
