# Config de nginx para cobranza_cessa en 10.1.1.88 -- reenvía a gunicorn en
# 127.0.0.1:8001 (ver gunicorn.service). Copiar a
# /etc/nginx/sites-available/cobranza-cessa, symlink en sites-enabled,
# `sudo nginx -t && sudo systemctl reload nginx`.
#
# SEGURIDAD -- decidir con quien administra la red de CESSA antes de exponer
# esto a internet: cessa-laravel (Hostinger) solo necesita llegar a
# /api/externo/ (apps.facturacion_externa, protegido por X-Api-Key). El resto
# (/api/deudas/, /api/transacciones-qr/, /api/cajas/, /admin/, etc.) es el
# panel de cajera -- protegido por JWT, pero no hay motivo para que sea
# alcanzable desde internet. Si quien administra la red puede exponer
# selectivamente un solo path/subdominio (como ya hacen con
# api-cobranzas-test.bo-com-assec.net / api-siic-prod-1.bo-com-assec.net),
# preferir eso -- ver el "location /api/externo/" separado abajo, pensado
# para ese caso (un reverse-proxy externo que solo reenvía esa ruta).

server {
    listen 80;
    server_name _;  # reemplazar por el dominio/IP real que se decida

    client_max_body_size 5m;

    location /api/externo/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Panel de cajera (SPA + resto de /api/) -- pensado para quedar solo en
    # la red interna de CESSA, nunca expuesto tal cual a internet.
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
