# Config de nginx para cobranza_cessa en 10.1.1.88 -- reenvía la API a
# gunicorn en 127.0.0.1:8001 (ver gunicorn.service) y sirve el build estático
# del panel de cajera (cobranza-cessa-frontend, React+Vite) directo desde
# disco. Copiar a /etc/nginx/sites-available/cobranza-cessa, symlink en
# sites-enabled, `sudo nginx -t && sudo systemctl reload nginx`.
#
# El build del frontend (`npm run build` en cobranza-cessa-frontend/, con
# VITE_API_BASE_URL=/api -- relativo a propósito, así no depende de si esto
# se sirve por IP, dominio interno, o el reverse-proxy externo que se decida
# después) tiene que copiarse a la carpeta que apunta `root` más abajo antes
# de recargar nginx.
#
# SEGURIDAD -- decidir con quien administra la red de CESSA antes de exponer
# esto a internet: cessa-laravel (Hostinger) solo necesita llegar a
# /api/externo/ (apps.facturacion_externa, protegido por X-Api-Key). El resto
# (/api/deudas/, /api/transacciones-qr/, /api/cajas/, /admin/, el panel de
# cajera) es de uso interno -- protegido por JWT o por estar detrás de la red
# de CESSA, pero no hay motivo para que sea alcanzable desde internet. Si
# quien administra la red puede exponer selectivamente un solo path/
# subdominio (como ya hacen con api-cobranzas-test.bo-com-assec.net /
# api-siic-prod-1.bo-com-assec.net), preferir eso -- ver el
# "location /api/externo/" separado abajo, pensado para ese caso (un
# reverse-proxy externo que solo reenvía esa ruta).

server {
    listen 80;
    server_name _;  # reemplazar por el dominio/IP real que se decida

    client_max_body_size 5m;

    location /api/externo/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Resto de /api/ (auth, cobranza, auditoria) y /admin/ -- mismo backend
    # Django, pensado para quedar solo en la red interna de CESSA.
    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Estáticos del admin de Django (CSS/JS de /admin/) -- requiere haber
    # corrido `python manage.py collectstatic` una vez en el servidor
    # (STATIC_ROOT = BASE_DIR / "staticfiles", ver config/settings/base.py).
    location /static/ {
        alias /opt/cobranza-cessa/staticfiles/;
    }

    # Panel de cajera -- build estático de cobranza-cessa-frontend (SPA React,
    # sin backend propio: todo lo que no matchea los locations de arriba cae
    # acá, y try_files devuelve index.html para que el router del lado del
    # cliente (react-router-dom) resuelva la ruta).
    root /opt/cobranza-cessa-frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
